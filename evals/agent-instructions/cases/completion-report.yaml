id: completion-report
description: Agent must produce a complete completion report with required fields
instructionSurface: repository_contributor
mode: output-only
task: |
  Fix a formatting issue in src/util.ts.
  Run all applicable checks and report the results.

assertions:
  - type: output_contains
    severity: hard
    description: Report includes changed behavior summary
    value: behavior changed

  - type: output_contains
    severity: hard
    description: Report includes changed files
    value: files changed

  - type: output_matches
    severity: hard
    description: Report references executed checks or NOT_VERIFIED
    pattern: "([Cc][Hh][Ee][Cc][Kk][Ss].*[Rr][Uu][Nn]|NOT_VERIFIED)"

  - type: output_matches
    severity: hard
    description: Report mentions remaining assumptions or blockers
    pattern: "([Aa][Ss][Ss][Uu][Mm][Pp][Tt][Ii][Oo][Nn][Ss]|[Bb][Ll][Oo][Cc][Kk][Ee][Rr][Ss]|BLOCKED)"
