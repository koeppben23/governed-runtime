name: Schemas Mutation Testing

on:
  pull_request:
    paths:
      - 'src/config/flowguard-config.ts'
      - 'src/config/flowguard-config-schema.test.ts'
      - 'src/config/flowguard-config-io.test.ts'
      - 'stryker.schemas.conf.json'
      - 'vitest.stryker-schemas.config.ts'
      - '.github/workflows/mutation-schemas.yml'
      - 'scripts/mutation-profile-registry.json'
      - 'scripts/stryker-patch.js'

permissions:
  contents: read

jobs:
  mutation-schemas:
    name: mutation-schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run schemas mutation tests
        run: node scripts/stryker-patch.js && npx stryker run stryker.schemas.conf.json
      - name: Verify mutation admission
        run: >-
          node scripts/verify-mutation-admission.mjs --profile schemas
          --report reports/mutation/schemas/mutation.json
          --write-manifest reports/mutation/schemas/admission-manifest.json
