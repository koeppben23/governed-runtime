name: Agent Instruction Evals PR

on:
  pull_request:
    paths:
      - 'src/**'
      - 'evals/**'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/actions/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evals:
    name: deterministic-evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Prepare Node
        uses: ./.github/actions/prepare-node
      - name: Run deterministic eval tests
        run: npm run test:evals
