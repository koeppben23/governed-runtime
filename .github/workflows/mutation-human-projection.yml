name: Mutation Testing (Human Projection)

# Scope: path-filtered pull_request + manual dispatch — an ADVISORY check.
#
# The full-suite mutation cadence is intentionally NOT a PR gate (see the
# rationale in mutation.yml). This targeted profile is a focused semantic
# check on the Claim/Human Projection authority modules. It runs only when
# those files change, uploads the Stryker JSON report as a CI artifact
# (7-day retention), and does NOT apply a global score threshold — the
# artifact is the evidence; the score is diagnostic.
#
# NOT a required merge gate. The broad mutation health check lives in the
# scheduled mutation.yml workflow.

on:
  pull_request:
    paths:
      - 'src/presentation/claim-resolution.ts'
      - 'src/presentation/human-verification.ts'
      - 'src/presentation/claim-human-projection.ts'
      - 'src/presentation/claim-diagnostic-copy.ts'
      - 'src/presentation/proof-requirement-copy.ts'
      - 'src/presentation/reason-copy.ts'
      - 'src/presentation/reason-projection.ts'
      - 'src/presentation/human-projection.ts'
      - 'stryker.human-projection.conf.json'
      - 'vitest.stryker-human-projection.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-human-projection:
    name: mutation-human-projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Human Projection mutation tests (advisory)
        run: node scripts/stryker-patch.js && npx stryker run stryker.human-projection.conf.json
        continue-on-error: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: mutation-human-projection-report
          path: reports/mutation/
          retention-days: 7
