name: Mutation Testing (Human Projection)

# Scope: pull_request + manual dispatch — a narrow, deterministic PR check.
#
# The full-suite mutation cadence is intentionally NOT a PR gate (see the
# rationale in mutation.yml): restricting `--mutate` to changed files is
# unreliable with this repo's `perTest` coverageAnalysis + vitest-runner patch.
# This targeted profile avoids that problem by mutating the complete Human
# Projection authority (reason-copy, reason-projection, human-projection,
# markdown renderBlocker) against a fixed test subset, so it is fast, seeded,
# and reproducible. It runs on every PR and uploads the Stryker JSON report as
# an artifact (7-day retention) so the mutation score is independently
# verifiable from GitHub.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-human-projection:
    name: mutation-human-projection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Human Projection mutation tests
        run: node scripts/stryker-patch.js && npx stryker run stryker.human-projection.conf.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: mutation-human-projection-report
          path: reports/mutation/
          retention-days: 7
