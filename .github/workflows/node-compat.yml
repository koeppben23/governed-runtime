name: Node Compatibility

on:
  schedule:
    - cron: '0 4 * * 2' # Tuesdays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          FORCE_COLOR: 0

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Pack tarball
        run: |
          mkdir -p /tmp/compat-artifact
          npm pack --pack-destination /tmp/compat-artifact --silent

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: compat-tarball
          path: /tmp/compat-artifact/flowguard-core-*.tgz
          retention-days: 1

  verify:
    name: verify (${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            status: supported-runtime
            continue-on-error: false
          - node: '22'
            status: supported-runtime
            continue-on-error: false
          - node: '24'
            status: supported-runtime
            continue-on-error: false
          - node: '26'
            status: forward-compatibility-probe
            continue-on-error: true
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download tarball
        uses: actions/download-artifact@d3de7924c60c0732e7dfdb0ad8d9cddc3db974f4 # actions/download-artifact v5.0.0
        with:
          name: compat-tarball

      - name: Install and verify artifact
        run: |
          mkdir /tmp/compat-test && cd /tmp/compat-test
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/flowguard-core-"*.tgz >/dev/null 2>&1
          node --input-type=module -e "
            await import('@flowguard/core');
            await import('@flowguard/core/integration');
            await import('@flowguard/core/integration/tools');
            await import('@flowguard/core/testing');
            await import('@flowguard/core/tsa');
          "
          npx flowguard --help >/dev/null 2>&1
          echo "ok: artifact install and import on Node ${{ matrix.node }} (status: ${{ matrix.status }})"
        continue-on-error: ${{ matrix.continue-on-error }}
