name: Node Compatibility

on:
  schedule:
    - cron: '0 4 * * 2' # Tuesdays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  node-compat:
    name: node-compat (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            status: supported-runtime
            continue-on-error: false
          - node: '24'
            status: supported-runtime
            continue-on-error: false
          - node: '26'
            status: forward-compatibility-probe
            continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          FORCE_COLOR: 0

      - name: Type check
        run: npm run check
        env:
          FORCE_COLOR: 0
        continue-on-error: ${{ matrix.continue-on-error }}

      - name: Run tests
        run: npm test
        env:
          FORCE_COLOR: 0
        continue-on-error: ${{ matrix.continue-on-error }}

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0
        continue-on-error: ${{ matrix.continue-on-error }}

      - name: Verify install smoke
        run: npm run test:install-verify
        env:
          FORCE_COLOR: 0
        continue-on-error: ${{ matrix.continue-on-error }}
