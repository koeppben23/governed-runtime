name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
        env:
          FORCE_COLOR: 0

  known-issues-note:
    name: known-issues-note
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
      - name: Hint when trust-boundary changes miss KNOWN_ISSUES.md
        run: node scripts/check-known-issues-note.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  unused-exports-note:
    name: unused-exports-note
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Hint on new unused exports against the committed baseline
        run: node scripts/check-unused-exports.mjs

  test:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [unit, coverage, integration_perf, provider-conformance]
    if: always()
    timeout-minutes: 1
    steps:
      - name: Confirm test, coverage, PERF, and provider conformance jobs passed
        run: |
          echo "unit: ${{ needs.unit.result }}"
          echo "coverage: ${{ needs.coverage.result }}"
          echo "integration-perf: ${{ needs.integration_perf.result }}"
          echo "provider-conformance: ${{ needs.provider-conformance.result }}"
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.coverage.result }}" != "success" ] || [ "${{ needs.integration_perf.result }}" != "success" ] || [ "${{ needs.provider-conformance.result }}" != "success" ]; then
            echo "Blocked: unit, coverage, integration-perf, or provider-conformance job failed"
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run coverage
        run: npm run test:coverage:ci
        env:
          FORCE_COLOR: 0
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1
      - name: Comment coverage summary
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # actions/github-script v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const candidates = [
              'coverage/unit/coverage-summary.json',
              'coverage/coverage-summary.json',
            ];
            const summaryPath = candidates.find((file) => fs.existsSync(file));
            if (!summaryPath) {
              core.warning('No coverage-summary.json found; skipping PR coverage comment.');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8')).total;
            const rows = ['lines', 'branches', 'functions', 'statements'].map((key) => {
              const item = summary[key];
              return `| ${key} | ${item.pct}% | ${item.covered}/${item.total} |`;
            });
            const marker = '<!-- flowguard-coverage-summary -->';
            const body = [
              marker,
              '## Coverage Summary',
              '',
              '| Metric | Coverage | Covered/Total |',
              '| --- | ---: | ---: |',
              ...rows,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  provider-conformance:
    name: provider-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # actions/setup-java v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: '3.12'
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go v7.0.0
        with:
          go-version: '1.23'
          # Golden fixture provenance: Go 1.26.5. CI tests against 1.23 for
          # broad compatibility — go test -json output is stable across versions.
      - name: Install project dependencies
        run: npm ci
      - name: Install fixture dependencies
        run: |
          cd test/conformance/assertions/projects/vitest && npm ci
          cd ../jest && npm ci
          cd ../pytest && pip install -r requirements.txt
          cd ../go && go mod download
      - name: Run provider runtime conformance
        run: npm run test:provider-conformance
        env:
          FORCE_COLOR: 0
          FLOWGUARD_RUNTIME_CONFORMANCE: '1'

  integration_perf:
    name: integration-perf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run integration PERF tests
        run: |
          echo "FLOWGUARD_PERF=$FLOWGUARD_PERF"
          npm run test:integration:perf
        env:
          FORCE_COLOR: 0
          FLOWGUARD_PERF: '1'

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run architecture tests
        run: npm run test:architecture
        env:
          FORCE_COLOR: 0

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check production and test contexts
        run: npm run check
        env:
          FORCE_COLOR: 0

  sdk-baseline:
    name: sdk-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: SDK type drift check
        run: node scripts/sdk-type-snapshot.mjs
      - name: Trigger SDK update on version mismatch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_version=$(node -p "JSON.parse(require('fs').readFileSync('.sdk-baselines/opencode/version.json','utf8')).version")
          installed_version=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@opencode-ai/plugin/package.json','utf8')).version")
          if [ "$baseline_version" != "$installed_version" ]; then
            echo "SDK version mismatch: baseline=$baseline_version installed=$installed_version"
            gh workflow run opencode-sdk-update.yml
          else
            echo "SDK type drift detected but versions match ($baseline_version); skipping auto-update."
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:strict
        env:
          FORCE_COLOR: 0

  unused-dependencies:
    name: unused-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check unused dependencies
        run: npm run check:unused-dependencies
        env:
          FORCE_COLOR: 0

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run check:format
        env:
          FORCE_COLOR: 0

  doc-drift:
    name: doc-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check documentation inventory drift
        run: npm run check:doc-drift
        env:
          FORCE_COLOR: 0

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run fuzz tests (fast gate)
        run: npm run test:fuzz
        env:
          FAST_CHECK_NUM_RUNS: 100
          FAST_CHECK_SEED: 12345

  actions-pinning:
    name: actions-pinning
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check GitHub Actions pinning
        run: npm run check:actions-pinned

  node-toolchain:
    name: node-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Check node toolchain consistency
        run: node scripts/check-node-toolchain-consistency.mjs

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Verify ESM import correctness
        run: npm run check:esm
        env:
          FORCE_COLOR: 0

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  build-clean:
    name: build-clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Verify clean working tree after build
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if ! git diff --exit-code || [ -n "$status" ]; then
            echo "::error::npm run build produced uncommitted changes."
            printf '%s\n' "$status"
            exit 1
          fi

  install-verify:
    name: install-verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist/

      - name: Restore executable permissions
        shell: bash
        run: |
          node <<'NODE'
          const { chmodSync } = require('node:fs');
          const pkg = require('./package.json');

          const bins =
            typeof pkg.bin === 'string'
              ? [pkg.bin]
              : Object.values(pkg.bin ?? {});

          if (bins.length === 0) {
            throw new Error('package.json declares no shipped binaries');
          }

          for (const binPath of bins) {
            chmodSync(binPath, 0o755);
          }
          NODE

      - name: Run install-verify smoke tests
        run: npm run test:install-verify
        env:
          FORCE_COLOR: 0

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist/

      - name: Restore executable permissions
        shell: bash
        run: |
          node <<'NODE'
          const { chmodSync } = require('node:fs');
          const pkg = require('./package.json');

          const bins =
            typeof pkg.bin === 'string'
              ? [pkg.bin]
              : Object.values(pkg.bin ?? {});

          if (bins.length === 0) {
            throw new Error('package.json declares no shipped binaries');
          }

          for (const binPath of bins) {
            chmodSync(binPath, 0o755);
          }
          NODE

      - name: Install OpenCode CLI
        run: |
          OPENCODE_VERSION=$(node -p "require('./.sdk-baselines/opencode/host-version.json').version")
          npm install -g --prefer-offline --no-audit --no-fund "opencode-ai@$OPENCODE_VERSION"

      - name: Verify OpenCode CLI availability
        run: |
          if ! command -v opencode >/dev/null 2>&1; then
            echo "::error::opencode CLI not found on runner. Smoke tests require it."
            exit 1
          fi
          opencode --version
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          FORCE_COLOR: 0
          OPENCODE_DISABLE_AUTOUPDATE: '1'
          RUN_OPENCODE_ACP_TESTS: '1'

  independent-review-e2e:
    name: independent-review-e2e
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist/

      - name: Restore executable permissions
        shell: bash
        run: |
          node <<'NODE'
          const { chmodSync } = require('node:fs');
          const pkg = require('./package.json');

          const bins =
            typeof pkg.bin === 'string'
              ? [pkg.bin]
              : Object.values(pkg.bin ?? {});

          if (bins.length === 0) {
            throw new Error('package.json declares no shipped binaries');
          }

          for (const binPath of bins) {
            chmodSync(binPath, 0o755);
          }
          NODE

      - name: Install OpenCode CLI
        run: |
          OPENCODE_VERSION=$(node -p "require('./.sdk-baselines/opencode/host-version.json').version")
          npm install -g --prefer-offline --no-audit --no-fund "opencode-ai@$OPENCODE_VERSION"

      - name: Verify OpenCode CLI availability
        run: |
          if ! command -v opencode >/dev/null 2>&1; then
            echo "::error::opencode CLI not found on runner. Independent-review runtime e2e is mandatory."
            exit 1
          fi
          opencode --version
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'

      - name: Run independent-review e2e verifier
        run: npm run test:independent-review-e2e
        env:
          FORCE_COLOR: 0
          OPENCODE_DISABLE_AUTOUPDATE: '1'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # rhysd/actionlint v1.7.12
        with:
          args: '-config-file .github/actionlint.yaml -color'

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # gitleaks/gitleaks-action v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-policy:
    name: security-policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Check for SECURITY.md
        run: |
          if [ ! -f SECURITY.md ]; then
            echo "::error::SECURITY.md is missing"
            exit 1
          fi
          echo "SECURITY.md found"

      - name: Check for private vulnerability reporting
        run: |
          if [ ! -f .github/security-advisories.yml ] && [ ! -d .github/security-advisories ]; then
            echo "::error::Private vulnerability reporting not configured. Enable it at https://github.com/${{ github.repository }}/security/advisories/new"
            exit 1
          fi

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Dependency review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # actions/dependency-review-action v5.0.0
        with:
          fail-on-severity: high

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist/

      - name: Restore executable permissions
        shell: bash
        run: |
          node <<'NODE'
          const { chmodSync } = require('node:fs');
          const pkg = require('./package.json');

          const bins =
            typeof pkg.bin === 'string'
              ? [pkg.bin]
              : Object.values(pkg.bin ?? {});

          if (bins.length === 0) {
            throw new Error('package.json declares no shipped binaries');
          }

          for (const binPath of bins) {
            chmodSync(binPath, 0o755);
          }
          NODE

      - name: Pack real release tarball for testing
        id: tarball
        shell: bash
        run: |
          PKG_FILE=$(npm pack --silent)
          mkdir -p "$RUNNER_TEMP/flowguard-test"
          mv "$PKG_FILE" "$RUNNER_TEMP/flowguard-test/$PKG_FILE"
          node -e "const { createHash } = require('node:crypto'); const { readFileSync, writeFileSync } = require('node:fs'); const { basename, dirname } = require('node:path'); const tarball = process.argv[1]; const sha = createHash('sha256').update(readFileSync(tarball)).digest('hex'); writeFileSync(dirname(tarball) + '/checksums.sha256', sha + '  ' + basename(tarball) + '\n');" "$RUNNER_TEMP/flowguard-test/$PKG_FILE"
          echo "path=$RUNNER_TEMP/flowguard-test/$PKG_FILE" >> "$GITHUB_OUTPUT"

      - name: Install FlowGuard (test install)
        shell: bash
        run: |
          node dist/cli/install.js install --install-scope repo --core-tarball "${{ steps.tarball.outputs.path }}"

      - name: Verify CLI doctor
        shell: bash
        run: node dist/cli/install.js doctor --install-scope repo

  ci-runtime-report:
    name: ci-runtime-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    continue-on-error: true
    needs:
      - unit
      - test
      - coverage
      - integration_perf
      - architecture
      - typecheck
      - sdk-baseline
      - lint
      - unused-dependencies
      - format
      - fuzz
      - actions-pinning
      - build
      - build-clean
      - install-verify
      - smoke
      - independent-review-e2e
      - actionlint
      - secrets-scan
      - security-policy
      - dependency-review
      - install
    steps:
      - name: Summarize job runtimes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # actions/github-script v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            const rows = jobs
              .filter((job) => job.name !== 'ci-runtime-report')
              .map((job) => {
                const started = job.started_at ? Date.parse(job.started_at) : NaN;
                const completed = job.completed_at ? Date.parse(job.completed_at) : NaN;
                const seconds = Number.isFinite(started) && Number.isFinite(completed)
                  ? Math.max(0, Math.round((completed - started) / 1000))
                  : null;
                return { name: job.name, conclusion: job.conclusion ?? job.status, seconds };
              })
              .sort((a, b) => (b.seconds ?? -1) - (a.seconds ?? -1));

            const totalSeconds = rows.reduce((sum, row) => sum + (row.seconds ?? 0), 0);
            const table = rows.map((row) => {
              const duration = row.seconds === null ? 'n/a' : `${Math.floor(row.seconds / 60)}m ${row.seconds % 60}s`;
              return `| ${row.name} | ${row.conclusion} | ${duration} |`;
            });
            await core.summary
              .addHeading('CI Runtime Budget')
              .addRaw(`Total job runtime (sum, not wall-clock): ${Math.floor(totalSeconds / 60)}m ${totalSeconds % 60}s\n\n`)
              .addRaw('| Job | Conclusion | Duration |\n')
              .addRaw('| --- | --- | ---: |\n')
              .addRaw(`${table.join('\n')}\n`)
              .write();
