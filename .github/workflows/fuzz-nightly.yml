name: Fuzz Testing (Nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run deep fuzz tests
        id: fuzz
        shell: bash
        run: |
          set -o pipefail
          npm run test:fuzz:deep 2>&1 | tee fuzz-output.txt
        env:
          FAST_CHECK_SEED: 12345

      - name: Upload fuzz output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: fuzz-output
          path: fuzz-output.txt
          retention-days: 1

      - name: Report failure
        if: github.event_name == 'schedule' && failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled workflow failed: ${{ github.workflow }}"
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "## Scheduled workflow failure

          The scheduled \`${{ github.workflow }}\` workflow run failed.

          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Review the failed step for root cause."
          fi
