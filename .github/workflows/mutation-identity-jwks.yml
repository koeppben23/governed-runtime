name: Identity JWKS Mutation Testing

on:
  pull_request:
    paths:
      - 'src/identity/key-resolver.ts'
      - 'src/identity/key-resolver.test.ts'
      - 'stryker.identity-jwks.conf.json'
      - 'vitest.stryker-identity-jwks.config.ts'
      - '.github/workflows/mutation-identity-jwks.yml'
      - 'scripts/stryker-patch.js'

permissions:
  contents: read

jobs:
  mutation-identity-jwks:
    name: mutation-identity-jwks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run JWKS mutation tests
        run: node scripts/stryker-patch.js && npx stryker run stryker.identity-jwks.conf.json
