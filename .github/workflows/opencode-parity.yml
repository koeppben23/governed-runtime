name: OpenCode V2 acceptance parity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  # Pre-merge acceptance: add the `run-parity-acceptance` label to a PR.
  # The job-level guard below skips runs for every other label.
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read

concurrency:
  group: opencode-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-parity-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Prepare Node
        uses: ./.github/actions/prepare-node

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Verify ESM import correctness
        run: npm run check:esm
        env:
          FORCE_COLOR: 0

      - name: Pack one checksum-verified artifact for installed parity
        run: npm run pack:checksums

      - name: Upload shared installed-parity package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: inactive-parity-package
          path: |
            flowguard-core-*.tgz
            checksums.sha256
          if-no-files-found: error
          retention-days: 7

  inactive-parity:
    name: inactive-parity (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-parity-acceptance'
    runs-on: ${{ matrix.os }}
    needs: build
    # Linux/macOS run both suites together. Windows is split into parallel
    # suites below because six real npm installs take ~3.5 min each.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Prepare Node
        uses: ./.github/actions/prepare-node
      - name: Download identical packed product
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: inactive-parity-package
          path: inactive-parity-package/
      - name: Install and resolve the exact native candidate executable
        id: parity-host
        shell: bash
        run: |
          OPENCODE_SPEC=$(node -p "const c = require('./.sdk-baselines/opencode/cli-candidate.json'); c.package + '@' + c.version")
          npm install -g --prefer-offline --no-audit --no-fund "$OPENCODE_SPEC"
          OPENCODE_PACKAGE_ROOT="$(npm root -g)" node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync, existsSync } = require('node:fs');
          const { join } = require('node:path');
          const candidate = require('./.sdk-baselines/opencode/cli-candidate.json');
          const root = join(process.env.OPENCODE_PACKAGE_ROOT, candidate.package);
          const pkg = require(join(root, 'package.json'));
          const bin = join(root, typeof pkg.bin === 'string' ? pkg.bin : pkg.bin.opencode);
          const version = execFileSync(bin, ['--version'], { encoding: 'utf8', timeout: 30000 }).trim();
          if (version !== `opencode v${candidate.version}`) throw new Error(`Unexpected native host: ${version}`);
          const tarball = join(process.cwd(), 'inactive-parity-package', `flowguard-core-${require('./package.json').version}.tgz`);
          if (!existsSync(tarball)) throw new Error(`Missing shared parity artifact: ${tarball}`);
          appendFileSync(process.env.GITHUB_ENV, `OPENCODE_CLI=${bin}\nFLOWGUARD_TARBALL=${tarball}\n`);
          NODE
      - name: Reconcile original probes and verify installed mixed-session parity
        # One bootstrap at a time, reused by the second suite: the diagnostic
        # proved a solo npm bootstrap completes while two concurrent ones time out.
        run: npx vitest run --no-file-parallelism --project smoke src/cli/opencode-inactive-parity.smoke.test.ts src/cli/opencode-inactive-installed.smoke.test.ts --silent=false --reporter=default --reporter=json --outputFile=inactive-parity-results.json
        env:
          FORCE_COLOR: 0
          OPENCODE_LIVE: '1'
          FLOWGUARD_BOOTSTRAP_DIAGNOSTICS_DIR: inactive-parity-diagnostics/joint
          FLOWGUARD_BOOTSTRAP_PREFIX: inactive-parity-shared-bootstrap
      - name: Upload installed-parity test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: inactive-parity-results-${{ matrix.os }}
          path: inactive-parity-results.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload bootstrap phases and npm diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: inactive-parity-bootstrap-${{ matrix.os }}
          path: inactive-parity-diagnostics/
          if-no-files-found: error
          retention-days: 7

  inactive-parity-windows:
    name: inactive-parity (windows-latest, ${{ matrix.suite }})
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-parity-acceptance'
    runs-on: windows-latest
    needs: build
    # Split the slow Windows matrix so each job runs one installer-bearing
    # subset. Every case/assertion is preserved; Linux/macOS stay combined.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mixed
            file: src/cli/opencode-inactive-installed.smoke.test.ts
            filter: scoped during live catalogue
          - suite: repo
            file: src/cli/opencode-inactive-installed.smoke.test.ts
            filter: Git=(true|false), scope=repo
          - suite: global
            file: src/cli/opencode-inactive-installed.smoke.test.ts
            filter: Git=(true|false), scope=global
          - suite: original
            file: src/cli/opencode-inactive-parity.smoke.test.ts
            filter: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Prepare Node
        uses: ./.github/actions/prepare-node
      - name: Download identical packed product
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: inactive-parity-package
          path: inactive-parity-package/
      - name: Install and resolve the exact native candidate executable
        shell: bash
        run: |
          OPENCODE_SPEC=$(node -p "const c = require('./.sdk-baselines/opencode/cli-candidate.json'); c.package + '@' + c.version")
          npm install -g --prefer-offline --no-audit --no-fund "$OPENCODE_SPEC"
          OPENCODE_PACKAGE_ROOT="$(npm root -g)" node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync, existsSync } = require('node:fs');
          const { join } = require('node:path');
          const candidate = require('./.sdk-baselines/opencode/cli-candidate.json');
          const root = join(process.env.OPENCODE_PACKAGE_ROOT, candidate.package);
          const pkg = require(join(root, 'package.json'));
          const bin = join(root, typeof pkg.bin === 'string' ? pkg.bin : pkg.bin.opencode);
          const version = execFileSync(bin, ['--version'], { encoding: 'utf8', timeout: 30000 }).trim();
          if (version !== `opencode v${candidate.version}`) throw new Error(`Unexpected native host: ${version}`);
          const tarball = join(process.cwd(), 'inactive-parity-package', `flowguard-core-${require('./package.json').version}.tgz`);
          if (!existsSync(tarball)) throw new Error(`Missing shared parity artifact: ${tarball}`);
          appendFileSync(process.env.GITHUB_ENV, `OPENCODE_CLI=${bin}\nFLOWGUARD_TARBALL=${tarball}\n`);
          NODE
      - name: Run Windows parity suite ${{ matrix.suite }}
        id: windows-parity
        shell: bash
        run: |
          if [ -n "$SUITE_FILTER" ]; then
            npx vitest run --no-file-parallelism --project smoke "$SUITE_FILE" -t "$SUITE_FILTER" \
              --silent=false --reporter=default --reporter=json \
              --outputFile="inactive-parity-results-$SUITE_NAME.json"
          else
            npx vitest run --no-file-parallelism --project smoke "$SUITE_FILE" \
              --silent=false --reporter=default --reporter=json \
              --outputFile="inactive-parity-results-$SUITE_NAME.json"
          fi
        env:
          FORCE_COLOR: 0
          OPENCODE_LIVE: '1'
          SUITE_FILE: ${{ matrix.file }}
          SUITE_FILTER: ${{ matrix.filter }}
          SUITE_NAME: ${{ matrix.suite }}
          FLOWGUARD_BOOTSTRAP_DIAGNOSTICS_DIR: inactive-parity-diagnostics/${{ matrix.suite }}
          FLOWGUARD_BOOTSTRAP_PREFIX: inactive-parity-shared-bootstrap-${{ matrix.suite }}
      # Diagnostic A/B on the same VM: keep the original result above, then
      # repeat its two mixed cases with only the temporary fixture volume changed.
      # A passing control cannot replace a failed acceptance step.
      - name: Compare mixed setup on the runner temporary volume
        if: ${{ !cancelled() && matrix.suite == 'mixed' && steps.windows-parity.outcome != 'skipped' }}
        shell: bash
        run: |
          : "${FLOWGUARD_TARBALL:?Shared artifact is required}"
          npx vitest run --no-file-parallelism --project smoke \
            src/cli/opencode-inactive-installed.smoke.test.ts -t "scoped during live catalogue" \
            --silent=false --reporter=default --reporter=json \
            --outputFile=inactive-parity-volume-control.json
        env:
          FORCE_COLOR: 0
          OPENCODE_LIVE: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          FLOWGUARD_BOOTSTRAP_DIAGNOSTICS_DIR: inactive-parity-diagnostics/mixed-runner-temp
          FLOWGUARD_BOOTSTRAP_PREFIX: inactive-parity-shared-bootstrap-mixed
      - name: Upload runner-volume control results separately
        if: ${{ always() && matrix.suite == 'mixed' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: inactive-parity-volume-control-windows-mixed
          path: inactive-parity-volume-control.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload installed-parity test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: inactive-parity-results-windows-${{ matrix.suite }}
          path: inactive-parity-results-${{ matrix.suite }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload bootstrap phases and npm diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: inactive-parity-bootstrap-windows-${{ matrix.suite }}
          path: inactive-parity-diagnostics/
          if-no-files-found: error
          retention-days: 7
