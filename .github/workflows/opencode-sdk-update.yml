name: OpenCode SDK Update

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Native @opencode/plugin + @opencode/client V2 version or tag (API only)'
        required: false
        default: latest

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: opencode-sdk-update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Resolve native API candidate
        id: resolve
        env:
          REQUESTED: ${{ github.event.inputs.version || 'latest' }}
        run: |
          TARGET=$(npm view "@opencode/plugin@$REQUESTED" version)
          CLIENT=$(npm view "@opencode/client@$REQUESTED" version)
          test "$TARGET" = "$CLIENT"
          CURRENT=$(node -p "require('./package.json').dependencies['@opencode/plugin']")
          CURRENT_CLIENT=$(node -p "require('./package.json').dependencies['@opencode/client']")
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$TARGET" ] && [ "$CURRENT_CLIENT" = "$TARGET" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create candidate branch
        if: steps.resolve.outputs.needs_update == 'true'
        run: git switch -c "chore/opencode-api-${{ steps.resolve.outputs.target }}"
      - name: Update native packages and API baselines only
        if: steps.resolve.outputs.needs_update == 'true'
        run: npm run update:opencode-sdk -- "${{ steps.resolve.outputs.target }}"
      - name: Type check
        if: steps.resolve.outputs.needs_update == 'true'
        run: npm run check
      - name: Exact API baseline check
        if: steps.resolve.outputs.needs_update == 'true'
        run: node scripts/sdk-type-snapshot.mjs --platform opencode
      - name: SDK contract tests
        if: steps.resolve.outputs.needs_update == 'true'
        run: npm run test:sdk-contract:all
      - name: Integration tests
        if: steps.resolve.outputs.needs_update == 'true'
        run: npm run test:integration
      - name: Architecture
        if: steps.resolve.outputs.needs_update == 'true'
        run: npm run test:architecture
      - name: Lint
        if: steps.resolve.outputs.needs_update == 'true'
        run: npm run lint:strict
      - name: Build
        if: steps.resolve.outputs.needs_update == 'true'
        run: npm run build
      - name: Record completed API update in changelog
        if: steps.resolve.outputs.needs_update == 'true'
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { SdkContractError } from './scripts/sdk-type-snapshot.mjs';
          const file = 'CHANGELOG.md';
          const content = fs.readFileSync(file, 'utf8');
          const marker = '### Changed';
          const start = content.indexOf('## [Unreleased]');
          const end = content.indexOf('\n## ', start + 1);
          const at = content.indexOf(marker, start);
          if (start < 0 || at < 0 || (end >= 0 && at > end)) {
            throw new SdkContractError('Missing Unreleased Changed heading');
          }
          const entry = `${marker}\n\n- Updated native OpenCode API packages and type baselines to ${process.env.TARGET}; installed Desktop/CLI support is not certified by this update.`;
          fs.writeFileSync(file, content.slice(0, at) + content.slice(at).replace(marker, entry));
          NODE
      - name: Documentation and formatting gates
        if: steps.resolve.outputs.needs_update == 'true'
        run: |
          npm run check:doc-drift
          npm run check:format
      - name: Commit API candidate
        if: steps.resolve.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .sdk-baselines/opencode CHANGELOG.md
          git commit -m "chore(deps): update native opencode API baseline"
          npm run check:pr-documentation -- origin/develop HEAD
      - name: Push candidate branch
        if: steps.resolve.outputs.needs_update == 'true'
        run: git push origin "chore/opencode-api-${{ steps.resolve.outputs.target }}"
      - name: Open draft API review
        if: steps.resolve.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/opencode-api-${{ steps.resolve.outputs.target }}
        run: |
          gh pr create --draft --base develop --head "$BRANCH" --title "chore(deps): update native OpenCode API baseline" --body "Updates exact native plugin/client API pins and declarations. Passing API checks do not certify installed Desktop/CLI behavior, UI-origin operator actions, reviewer release/capture, recovery quiescence or INACTIVE parity. Installed acceptance remains an independent required gate; no host support baseline or historical evidence is changed."
      - name: Report candidate failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Native OpenCode API update requires manual review" --label sdk-drift --body "The native API candidate failed verification. Review $RUN_LINK before accepting regenerated declarations. This workflow does not establish installed host support."
