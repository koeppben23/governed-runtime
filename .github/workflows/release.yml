name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "Tag: $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Type check
        run: npm run check
        env:
          FORCE_COLOR: 0

      - name: Run tests
        run: npm test -- --exclude 'src/cli/install-verify.test.ts' --exclude 'src/cli/cli-contract-smoke.test.ts'
        env:
          FORCE_COLOR: 0

      - name: Lint (strict)
        run: npm run lint:strict
        env:
          FORCE_COLOR: 0

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Verify ESM import correctness
        run: npm run check:esm
        env:
          FORCE_COLOR: 0

      - name: Pack release tarball
        id: pack
        shell: bash
        run: |
          mkdir -p release
          PKG_FILE=$(npm pack --pack-destination release --silent)
          echo "path=release/$PKG_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: flowguard-release-tarball
          path: ${{ steps.pack.outputs.path }}
          retention-days: 1

  verify-runtime:
    name: verify-runtime (node ${{ matrix.node }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download release tarball
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # actions/download-artifact v5.0.0
        with:
          name: flowguard-release-tarball

      - name: Verify ESM imports
        run: |
          mkdir /tmp/runtime-test && cd /tmp/runtime-test
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/flowguard-core-"*.tgz >/dev/null 2>&1
          node --input-type=module -e "
            await import('@flowguard/core');
            await import('@flowguard/core/integration');
            await import('@flowguard/core/integration/tools');
            await import('@flowguard/core/testing');
            await import('@flowguard/core/tsa');
          "

      - name: Verify CLI
        run: |
          cd /tmp/runtime-test
          npx flowguard --help >/dev/null 2>&1

  release-smoke:
    name: release-smoke (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Pack release tarball
        id: pack
        shell: bash
        run: |
          mkdir -p release
          PKG_FILE=$(npm pack --pack-destination release --silent)
          echo "path=release/$PKG_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify release tarball
        run: npm run test:install-verify
        env:
          FORCE_COLOR: 0
          FLOWGUARD_TARBALL: ${{ steps.pack.outputs.path }}

  release:
    name: release
    needs: [verify, release-smoke, verify-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify ESM import correctness
        run: npm run check:esm

      - name: Copy LICENSE to dist
        run: cp LICENSE dist/

      - name: Create npm package
        run: |
          mkdir -p release
          npm pack --pack-destination release/

      - name: Validate asset naming
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          EXPECTED_FILENAME="flowguard-core-${PKG_VERSION}.tgz"
          CREATED_FILENAME=$(find release -maxdepth 1 -name "*.tgz" -type f -printf "%f\n" 2>/dev/null | head -1)
          echo "Expected: $EXPECTED_FILENAME"
          echo "Created: $CREATED_FILENAME"
          if [ "$CREATED_FILENAME" != "$EXPECTED_FILENAME" ]; then
            echo "::error::Asset filename mismatch. Expected '$EXPECTED_FILENAME' but got '$CREATED_FILENAME'"
            exit 1
          fi
          echo "Asset naming validated successfully."

      - name: Verify release tarball
        run: |
          FLOWGUARD_TARBALL="$(ls release/*.tgz)" npm run test:install-verify
        env:
          FORCE_COLOR: 0

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum ./*.tgz > checksums.sha256

      - name: Generate SBOM (CycloneDX)
        run: |
          npm exec --package @cyclonedx/cyclonedx-npm@4.1.1 -- cyclonedx-npm \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file release/sbom.cdx.json \
            --validate

      - name: Attest package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # actions/attest-build-provenance v4.1.1
        with:
          subject-path: release/*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tgz \
            release/checksums.sha256 \
            release/sbom.cdx.json \
            LICENSE \
            --title "FlowGuard v${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
