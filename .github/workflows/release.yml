name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "Tag: $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Type check
        run: npm run check
        env:
          FORCE_COLOR: 0

      - name: Run tests
        run: npm test
        env:
          FORCE_COLOR: 0

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Verify ESM import correctness
        run: npm run check:esm
        env:
          FORCE_COLOR: 0

  release-smoke:
    name: release-smoke (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Pack release tarball
        id: pack
        shell: bash
        run: |
          mkdir -p release
          PKG_FILE=$(npm pack --pack-destination release --silent)
          echo "path=release/$PKG_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify release tarball
        run: npm run test:install-verify
        env:
          FORCE_COLOR: 0
          FLOWGUARD_TARBALL: ${{ steps.pack.outputs.path }}

  release:
    name: release
    needs: [verify, release-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify ESM import correctness
        run: npm run check:esm

      - name: Copy LICENSE to dist
        run: cp LICENSE dist/

      - name: Create npm package
        run: |
          mkdir -p release
          npm pack --pack-destination release/

      - name: Validate asset naming
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          EXPECTED_FILENAME="flowguard-core-${PKG_VERSION}.tgz"
          CREATED_FILENAME=$(find release -maxdepth 1 -name "*.tgz" -type f -printf "%f\n" 2>/dev/null | head -1)
          echo "Expected: $EXPECTED_FILENAME"
          echo "Created: $CREATED_FILENAME"
          if [ "$CREATED_FILENAME" != "$EXPECTED_FILENAME" ]; then
            echo "::error::Asset filename mismatch. Expected '$EXPECTED_FILENAME' but got '$CREATED_FILENAME'"
            exit 1
          fi
          echo "Asset naming validated successfully."

      - name: Verify release tarball
        run: |
          FLOWGUARD_TARBALL="$(ls release/*.tgz)" npm run test:install-verify
        env:
          FORCE_COLOR: 0

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum ./*.tgz > checksums.sha256

      - name: Generate SBOM (CycloneDX)
        run: |
          npm exec --package @cyclonedx/cyclonedx-npm@4.1.1 -- cyclonedx-npm \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file release/sbom.cdx.json \
            --validate

      - name: Attest package provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # actions/attest-build-provenance v4.1.0
        with:
          subject-path: release/*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tgz \
            release/checksums.sha256 \
            release/sbom.cdx.json \
            LICENSE \
            --title "FlowGuard v${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
