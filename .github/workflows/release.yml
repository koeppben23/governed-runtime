name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Require tag target to equal protected main
        shell: bash
        run: |
          git fetch --no-tags origin main
          TAG_TARGET="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          MAIN_TARGET="$(git rev-parse origin/main)"
          if [ "$TAG_TARGET" != "$MAIN_TARGET" ]; then
            echo "::error::Release tag must target the exact current origin/main commit"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "Tag: $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Type check
        run: npm run check
        env:
          FORCE_COLOR: 0

      - name: Run tests
        run: npm test -- --exclude 'src/cli/install-verify.test.ts' --exclude 'src/cli/cli-contract-smoke.test.ts'
        env:
          FORCE_COLOR: 0

      - name: Lint (strict)
        run: npm run lint:strict
        env:
          FORCE_COLOR: 0

      - name: Build
        run: npm run build
        env:
          FORCE_COLOR: 0

      - name: Verify ESM import correctness
        run: npm run check:esm
        env:
          FORCE_COLOR: 0

      - name: Pack release tarball
        id: pack
        shell: bash
        run: |
          mkdir -p release
          PKG_FILE=$(npm pack --pack-destination release --silent)
          echo "path=release/$PKG_FILE" >> "$GITHUB_OUTPUT"

      - name: Record release artifact digest
        run: |
          cd release
          sha256sum "$(basename "${{ steps.pack.outputs.path }}")" > checksums.sha256

      - name: Generate release metadata
        run: |
          cp LICENSE release/LICENSE
          npm exec --package @cyclonedx/cyclonedx-npm@4.1.1 -- cyclonedx-npm \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file release/sbom.cdx.json \
            --validate

      - name: Upload release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: flowguard-release-artifact
          path: release/
          retention-days: 1

  verify-runtime:
    name: verify-runtime (node ${{ matrix.node }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: flowguard-release-artifact

      - name: Verify release artifact digest
        shell: bash
        run: sha256sum --check checksums.sha256

      - name: Verify ESM imports
        run: |
          mkdir /tmp/runtime-test && cd /tmp/runtime-test
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/flowguard-core-"*.tgz >/dev/null 2>&1
          node --input-type=module -e "
            await import('@flowguard/core');
            await import('@flowguard/core/integration');
            await import('@flowguard/core/integration/tools');
            await import('@flowguard/core/testing');
            await import('@flowguard/core/tsa');
          "

      - name: Verify CLI
        run: |
          cd /tmp/runtime-test
          npx flowguard --help >/dev/null 2>&1

  release-smoke:
    name: release-smoke (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: flowguard-release-artifact
          path: release

      - name: Verify release artifact digest
        shell: bash
        run: cd release && sha256sum --check checksums.sha256

      - name: Verify release tarball
        shell: bash
        run: FLOWGUARD_TARBALL="$(printf '%s\n' release/flowguard-core-*.tgz)" npm run test:install-verify
        env:
          FORCE_COLOR: 0

  mutation:
    name: mutation
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run mutation tests
        run: npm run mutation

  release:
    name: release
    needs: [verify, release-smoke, verify-runtime, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: flowguard-release-artifact
          path: release

      - name: Verify release artifact digest
        run: cd release && sha256sum --check checksums.sha256

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance v4.2.2
        with:
          subject-path: release/*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tgz \
            release/checksums.sha256 \
            release/sbom.cdx.json \
            release/LICENSE \
            --title "FlowGuard v${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
