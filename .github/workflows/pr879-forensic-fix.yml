              """configuration is validated by `RunnerConfigSchema`; use only fields defined by
that schema. Provider, model, provider model version, runner version, command,
arguments, checked-out Git commit, FlowGuard version, and mandate digest are
persisted in `summary.json`. Missing runner/model identity is rejected before a
run starts so cross-provider results cannot silently lose provenance.""",
          )
          replace_once(
              'evals/agent-instructions/README.md',
              '  "command": "agent-command",\n  "promptTransport": "stdin",',
              '  "command": "agent-command",\n  "provider": "provider-id",\n  "model": "model-id",\n  "modelVersion": "provider-model-version",\n  "runnerVersion": "runner-cli-version",\n  "promptTransport": "stdin",',
          )
          replace_once(
              'evals/agent-instructions/README.md',
              "Advisory assertion failures produce warnings but do not cause `FAIL`.",
              """Advisory assertion failures produce warnings but do not cause `FAIL`.
Persisted and rendered quality totals are grouped only by `instructionSurface`;
contributor and FlowGuard-product results are never collapsed into one assurance
number.""",
          )

          # Deterministic eval harness tests become part of the main CI gate.
          replace_once(
              'package.json',
              '    "test:unit": "vitest run --project unit",\n',
              '    "test:unit": "vitest run --project unit",\n    "test:evals": "vitest run --project evals",\n',
          )
          ci = '.github/workflows/ci.yml'
          eval_job = """  evals:
    name: agent-instruction-evals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic agent-instruction eval harness tests
        run: npm run test:evals
        env:
          FORCE_COLOR: 0

"""
          replace_once(ci, '  test:\n    name: ci-gate\n', eval_job + '  test:\n    name: ci-gate\n')
          replace_once(
              ci,
              'needs: [unit, coverage, integration_perf, provider-conformance, regulated_e2e]',
              'needs: [unit, coverage, evals, integration_perf, provider-conformance, regulated_e2e]',
          )
          replace_once(
              ci,
              'Confirm test, coverage, PERF, regulated e2e, and provider conformance jobs passed',
              'Confirm test, coverage, eval harness, PERF, regulated e2e, and provider conformance jobs passed',
          )
          replace_once(
              ci,
              '          echo "coverage: ${{ needs.coverage.result }}"\n',
              '          echo "coverage: ${{ needs.coverage.result }}"\n          echo "evals: ${{ needs.evals.result }}"\n',
          )
          replace_once(
              ci,
              'if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.coverage.result }}" != "success" ] || [ "${{ needs.integration_perf.result }}" != "success" ] || [ "${{ needs.provider-conformance.result }}" != "success" ] || [ "${{ needs.regulated_e2e.result }}" != "success" ]; then',
              'if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.coverage.result }}" != "success" ] || [ "${{ needs.evals.result }}" != "success" ] || [ "${{ needs.integration_perf.result }}" != "success" ] || [ "${{ needs.provider-conformance.result }}" != "success" ] || [ "${{ needs.regulated_e2e.result }}" != "success" ]; then',
          )
          replace_once(
              ci,
              'echo "Blocked: unit, coverage, integration-perf, provider-conformance, or regulated-e2e job failed"',
              'echo "Blocked: unit, coverage, evals, integration-perf, provider-conformance, or regulated-e2e job failed"',
          )
          PY

      - name: Format changed files
        run: |
          npm run format
          npx prettier --write \
            evals/agent-instructions/schema.ts \
            evals/agent-instructions/score.ts \
            evals/agent-instructions/run.ts \
            evals/agent-instructions/cli.ts \
            evals/agent-instructions/github-summary.ts \
            evals/agent-instructions/README.md \
            evals/agent-instructions/cases/product-prompt-injection.yaml \
            evals/agent-instructions/runner-configs/fake-ci.json \
            evals/agent-instructions/__tests__/prompt-transport.test.ts \
            evals/agent-instructions/__tests__/process-runner.test.ts \
            evals/agent-instructions/__tests__/run-security.test.ts \
            evals/agent-instructions/__tests__/report.test.ts \
            evals/agent-instructions/__tests__/score.test.ts \
            evals/agent-instructions/__tests__/github-summary.test.ts

      - name: Verify focused suites
        run: |
          npx vitest run --project unit src/cli/install-install.test.ts src/cli/templates-hash.test.ts
          npx vitest run --project integration src/integration/review/prompt-builders.test.ts
          npm run test:evals

      - name: Verify static quality
        run: |
          npm run check
          npm run lint:strict
          npm run check:format

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix(mandates): close installer and eval assurance gaps"
          git push origin HEAD:feat/mandates-v5
