  for (const result of caseResults) {
    const summary = byInstructionSurface[result.instructionSurface];
    if (result.verdict === 'PASS') summary.passed++;
    else if (result.verdict === 'FAIL') summary.failed++;
    else summary.runnerErrors++;
  }
  return {
