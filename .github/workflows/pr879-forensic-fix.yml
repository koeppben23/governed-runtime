name: PR 879 Forensic Fix

on:
  push:
    branches:
      - feat/mandates-v5

permissions:
  contents: write

concurrency:
  group: pr879-forensic-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: feat/mandates-v5
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply forensic fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_once(path, old, new):
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              write(path, content.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              content = read(path)
              count = content.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:100]!r}')
              write(path, content.replace(old, new))

          def replace_between(path, start, end, replacement):
              content = read(path)
              i = content.find(start)
              if i < 0:
                  raise SystemExit(f'{path}: missing start marker {start!r}')
              j = content.find(end, i)
              if j < 0:
                  raise SystemExit(f'{path}: missing end marker {end!r}')
              if content.find(start, i + 1) >= 0 and content.find(start, i + 1) < j:
                  raise SystemExit(f'{path}: ambiguous start marker {start!r}')
              write(path, content[:i] + replacement + content[j:])

          # ------------------------------------------------------------------
          # Installer semantics: align stale tests with customer ownership.
          # ------------------------------------------------------------------
          path = 'src/cli/install-install.test.ts'
          replace_once(
              path,
              "it('flowguard-mandates.md is ALWAYS replaced even without --force', async () => {",
              "it('preserves customer-owned flowguard-mandates.md and reports an ownership conflict', async () => {",
          )
          replace_once(
              path,
              """      await fs.writeFile(mandatesPath, 'old content', 'utf-8');
      await install(repoArgs({ coreTarball: tarball }));
      const content = await fs.readFile(mandatesPath, 'utf-8');
      expect(content).toContain('# FlowGuard Agent Rules');""",
