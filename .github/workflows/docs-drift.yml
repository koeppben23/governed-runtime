name: Historical OpenCode V1 docs integrity (not V2 acceptance)

# Historical evidence only. No schedule or PR gate: V2 docs drift is NOT_VERIFIED.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  historical-integrity:
    name: historical V1 integrity only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version-file: .node-version
      - name: Historical integrity (cannot certify V2 docs)
        run: node scripts/docs-drift.mjs --historical --verbose
      - name: Report coverage boundary
        if: always()
        run: |
          echo 'V2 documentation drift: NOT_VERIFIED. This manual job checks only retained V1 evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A V2 replacement requires a verified source revision, document scope and hash contract; API SDK updates do not update historical pins.' >> "$GITHUB_STEP_SUMMARY"
