name: Mutation Testing

# Scope: scheduled (weekly) + release branches + manual dispatch — NOT a PR
# gate. A per-PR mutation gate was evaluated and rejected: the full-suite
# Stryker run is too expensive for per-PR execution, and restricting
# `--mutate` to changed files produces unreliable results with this repo's
# `perTest` coverageAnalysis + vitest-runner patch (spurious test-runner
# errors and artificially low scores). The supported `--incremental` cache
# mode still pays a full cold run and needs cross-run cache plumbing. Until
# that is solved, the full-suite mutation run stays on the weekly/release
# cadence and is intentionally NOT a required PR check
# (see .github/BRANCH-PROTECTION.md).

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    # The base admission run now covers 135 targets (v11 candidates included);
    # the standard ubuntu runner needs roughly 170 minutes, so the cap must not
    # truncate the mutation step before the admission manifest is verified.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run mutation

      - name: Write and verify mutation admission manifest
        run: |
          node scripts/verify-mutation-admission.mjs --profile base --write-profile-manifest
          node scripts/verify-mutation-admission.mjs --profile base --verify-profile-manifest --require-admitted

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 1

      - name: Report failure
        if: github.event_name == 'schedule' && failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled workflow failed: ${{ github.workflow }}"
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "## Scheduled workflow failure

          The scheduled \`${{ github.workflow }}\` workflow run failed.

          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Review the failed step for root cause."
          fi
