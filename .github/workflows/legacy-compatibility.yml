name: Legacy Compatibility Guard

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-compatibility:
    name: legacy-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify formatting
        run: npm run check:format
      - name: Verify installer regressions
        run: npx vitest run --project unit src/cli/install-install.test.ts src/cli/templates-hash.test.ts
      - name: Verify reviewer prompt contract
        run: npx vitest run --project integration src/integration/review/prompt-builders.test.ts
      - name: Verify agent instruction eval harness
        run: npx vitest run --project evals
      - name: Reject legacy compatibility on changed FlowGuard source
        run: >-
          node scripts/check-legacy-compatibility.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
