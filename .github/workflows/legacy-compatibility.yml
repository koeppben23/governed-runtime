name: Legacy Compatibility Guard

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-compatibility:
    name: legacy-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: feat/mandates-v5
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply host-eval repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected pattern missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          replace(
              'evals/agent-instructions/schema.ts',
              "export const InstructionHostSchema = z.enum(['opencode']);",
              "export const InstructionHostSchema = z.enum(['opencode', 'claude-code', 'codex']);",
          )
          replace(
              'evals/agent-instructions/schema.ts',
              "    if (\n      evalCase.instructionSurface === 'flowguard_product' &&\n      evalCase.instructionHost !== 'opencode'\n    ) {\n      ctx.addIssue({\n        code: 'custom',\n        path: ['instructionHost'],\n        message: 'flowguard_product cases require an explicit supported instructionHost',\n      });\n    }",
              "    if (\n      evalCase.instructionSurface === 'flowguard_product' &&\n      evalCase.instructionHost === undefined\n    ) {\n      ctx.addIssue({\n        code: 'custom',\n        path: ['instructionHost'],\n        message: 'flowguard_product cases require an explicit instructionHost',\n      });\n    }",
          )

          replace(
              'evals/agent-instructions/runners/process-runner.ts',
              "import { join, sep, basename } from 'node:path';",
              "import { join, sep, basename, dirname } from 'node:path';",
          )
          replace(
              'evals/agent-instructions/runners/process-runner.ts',
              "import { PACKAGE_VERSION } from '../../../src/shared/package-version.js';",
              "import { PACKAGE_VERSION } from '../../../src/shared/package-version.js';\nimport {\n  CLAUDE_CODE_PLUGIN_DIR,\n  claudeCodePluginFiles,\n  CODEX_PLUGIN_NAME,\n  codexPluginFiles,\n} from '../../../src/cli/templates.js';",
          )
          old_materialize = '''async function materializeInstructionSurface(
  workspaceRoot: string,
  instructionSurface: InstructionSurface,
  instructionHost: InstructionHost | undefined,
): Promise<string | null> {
  if (instructionSurface === 'repository_contributor') {
    return instructionHost === undefined
      ? null
      : 'repository_contributor evaluations must not declare a product instruction host';
  }

  if (instructionHost !== 'opencode') {
    return 'flowguard_product evaluations require an explicit supported instruction host: opencode';
  }

  const mandatesDir = join(workspaceRoot, '.opencode');
  mkdirSync(mandatesDir, { recursive: true });
  writeFileSync(
    join(mandatesDir, 'flowguard-mandates.md'),
    buildMandatesContent(PACKAGE_VERSION(), computeMandatesDigest()),
  );
  await mergeOpencodeJson(join(workspaceRoot, 'opencode.json'), 'repo');
  return null;
}'''
          new_materialize = '''function writeTemplateTree(root: string, files: Readonly<Record<string, string>>): void {
  for (const [relativePath, content] of Object.entries(files)) {
    const filePath = join(root, relativePath);
    mkdirSync(dirname(filePath), { recursive: true });
    writeFileSync(filePath, content, 'utf-8');
  }
}

async function materializeInstructionSurface(
  workspaceRoot: string,
  instructionSurface: InstructionSurface,
  instructionHost: InstructionHost | undefined,
): Promise<string | null> {
  if (instructionSurface === 'repository_contributor') {
    return instructionHost === undefined
      ? null
      : 'repository_contributor evaluations must not declare a product instruction host';
  }

  if (instructionHost === undefined) {
    return 'flowguard_product evaluations require an explicit instruction host';
  }

  if (instructionHost === 'opencode') {
    const mandatesDir = join(workspaceRoot, '.opencode');
    mkdirSync(mandatesDir, { recursive: true });
    writeFileSync(
      join(mandatesDir, 'flowguard-mandates.md'),
      buildMandatesContent(PACKAGE_VERSION(), computeMandatesDigest()),
    );
    await mergeOpencodeJson(join(workspaceRoot, 'opencode.json'), 'repo');
    return null;
  }

  if (instructionHost === 'claude-code') {
    const pluginRoot = join(workspaceRoot, CLAUDE_CODE_PLUGIN_DIR);
    writeTemplateTree(pluginRoot, claudeCodePluginFiles(PACKAGE_VERSION()));
    return null;
  }

  const pluginRoot = join(workspaceRoot, 'plugins', CODEX_PLUGIN_NAME);
  writeTemplateTree(pluginRoot, codexPluginFiles(PACKAGE_VERSION()));
  const marketplaceDir = join(workspaceRoot, '.agents', 'plugins');
  mkdirSync(marketplaceDir, { recursive: true });
  writeFileSync(
    join(marketplaceDir, 'marketplace.json'),
    JSON.stringify(
      {
        name: CODEX_PLUGIN_NAME,
        plugins: [
          {
            name: CODEX_PLUGIN_NAME,
            source: { source: 'local', path: `./plugins/${CODEX_PLUGIN_NAME}` },
            policy: { installation: 'AVAILABLE', authentication: 'ON_INSTALL' },
            category: 'Productivity',
          },
        ],
      },
      null,
      2,
    ) + '\\n',
    'utf-8',
  );
  return null;
}'''
          replace('evals/agent-instructions/runners/process-runner.ts', old_materialize, new_materialize)
          replace(
              'evals/agent-instructions/runners/process-runner.ts',
              "  const resolvedArgs = config.args.map((a) => a.replace('{repoRoot}', repoRoot));",
              "  const resolvedArgs = config.args.map((a) =>\n    a.replaceAll('{repoRoot}', repoRoot).replaceAll('{workspaceRoot}', workspaceRoot),\n  );",
          )

          schema_test = Path('evals/agent-instructions/__tests__/schema.test.ts')
          text = schema_test.read_text()
          marker = "  it('rejects a FlowGuard product case without an instruction host', () => {"
          addition = '''  it.each(['opencode', 'claude-code', 'codex'] as const)(
    'accepts FlowGuard product host %s',
    (instructionHost) => {
      const result = EvalCaseSchema.safeParse({
        id: `product-${instructionHost}`,
        description: 'A customer runtime mandate case',
        instructionSurface: 'flowguard_product',
        instructionHost,
        task: 'Do something',
        mode: 'output-only',
        assertions: [{ type: 'exit_code', value: 0, description: 'exit 0' }],
      });
      expect(result.success).toBe(true);
    },
  );

'''
          if marker not in text:
              raise SystemExit('schema test insertion marker missing')
          schema_test.write_text(text.replace(marker, addition + marker))

          runner_test = Path('evals/agent-instructions/__tests__/process-runner.test.ts')
          text = runner_test.read_text()
          marker = "  it('fails closed when a product evaluation omits its host', async () => {"
          addition = '''  it('materializes the production Claude Code plugin transport', async () => {
    const outcome = await runProcess(
      config(['pass']),
      FIXTURE,
      'test prompt',
      true,
      process.cwd(),
      {},
      'flowguard_product',
      'claude-code',
    );
    expect(outcome.status).toBe('completed');
    if (outcome.status === 'completed') {
      expect(outcome.afterContent.get('flowguard-plugin/.claude-plugin/plugin.json')).toContain(
        'FlowGuard Governance',
      );
      expect(outcome.afterContent.get('flowguard-plugin/skills/start/SKILL.md')).toContain(
        '# FlowGuard Start',
      );
    }
  });

  it('materializes the production Codex plugin transport and registration', async () => {
    const outcome = await runProcess(
      config(['pass']),
      FIXTURE,
      'test prompt',
      true,
      process.cwd(),
      {},
      'flowguard_product',
      'codex',
    );
    expect(outcome.status).toBe('completed');
    if (outcome.status === 'completed') {
      expect(outcome.afterContent.get('plugins/flowguard/AGENTS.md')).toContain(
        '# FlowGuard Codex Plugin',
      );
      const marketplace = JSON.parse(
        outcome.afterContent.get('.agents/plugins/marketplace.json') ?? '{}',
      ) as { plugins?: Array<{ source?: { path?: string } }> };
      expect(marketplace.plugins?.[0]?.source?.path).toBe('./plugins/flowguard');
    }
  });

'''
          if marker not in text:
              raise SystemExit('process-runner test insertion marker missing')
          runner_test.write_text(text.replace(marker, addition + marker))

          source_cases = [
              'product-high-risk-ambiguity.yaml',
              'product-not-verified.yaml',
              'product-prompt-injection.yaml',
              'product-tool-failure.yaml',
          ]
          for host in ('claude-code', 'codex'):
              for source_name in source_cases:
                  source = Path('evals/agent-instructions/cases') / source_name
                  base = source.read_text()
                  stem = source.stem
                  target = source.with_name(f'{stem}-{host}.yaml')
                  generated = base.replace(f'id: {stem}\n', f'id: {stem}-{host}\n', 1)
                  generated = generated.replace('instructionHost: opencode\n', f'instructionHost: {host}\n', 1)
                  generated = generated.replace('Customer product mandates', f'Customer {host} product mandates', 1)
                  generated = generated.replace('Product mandates', f'{host} product mandates', 1)
                  target.write_text(generated)

          replace(
              'evals/agent-instructions/README.md',
              "Every case declares `instructionSurface` explicitly. Product cases additionally\ndeclare `instructionHost`; the harness currently supports `opencode` only and\nfails closed when product host metadata is absent or unsupported. Claude Code and\nCodex product transport behavior remains `NOT_VERIFIED` until dedicated host\nmaterializers exist.",
              "Every case declares `instructionSurface` explicitly. Product cases additionally\ndeclare `instructionHost`; the harness supports `opencode`, `claude-code`, and\n`codex` and fails closed when product host metadata is absent. Host materializers\nare coupled to the production OpenCode merge path or the production Claude/Codex\nplugin templates. Live model behavior remains separately `NOT_VERIFIED` until a\nreal host/provider runner is executed.",
          )
          replace(
              'evals/agent-instructions/README.md',
              'cases/              — YAML case definitions (12 cases: 8 contributor, 4 product)',
              'cases/              — YAML case definitions (20 cases: 8 contributor, 12 product)',
          )
          replace(
              'evals/agent-instructions/README.md',
              "For `flowguard_product` + `opencode`, the runner materializes the managed mandate\nthrough the production renderer, digest, managed artifact builder, and the\nproduction `mergeOpencodeJson` path before invoking the configured host. Existing\ncustomer OpenCode configuration and non-FlowGuard instruction entries are\npreserved rather than overwritten.",
              "For `flowguard_product`, the runner materializes the selected host transport before\ninvoking the configured process. OpenCode uses the production renderer, digest,\nmanaged artifact builder, and `mergeOpencodeJson` path; Claude Code and Codex use\ntheir production plugin-template generators, with Codex registration materialized\nin the isolated workspace. Existing customer OpenCode configuration and\nnon-FlowGuard instruction entries are preserved rather than overwritten. Runner\narguments may use `{workspaceRoot}` when a real host CLI needs an explicit path\n(for example Claude Code's plugin directory).",
          )
          replace(
              'docs/agent-guidance/eval-suite.md',
              "> surfaces are separate. Product cases currently exercise the explicit OpenCode\n> instruction transport only; Claude Code and Codex product transport behavior\n> remains `NOT_VERIFIED`. Live provider runs remain advisory and require a local,\n> secret-backed runner configuration.",
              "> surfaces are separate. Product cases materialize the explicit OpenCode, Claude\n> Code, and Codex transports from production code/templates. This verifies harness\n> transport fidelity, not live model behavior. Live host/provider runs remain\n> `NOT_VERIFIED` until executed with the required local command and credentials.",
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format repaired files
        run: npx prettier --write evals/agent-instructions/schema.ts evals/agent-instructions/runners/process-runner.ts evals/agent-instructions/__tests__/schema.test.ts evals/agent-instructions/__tests__/process-runner.test.ts evals/agent-instructions/README.md docs/agent-guidance/eval-suite.md evals/agent-instructions/cases/product-*.yaml
      - name: Verify eval harness
        run: npx vitest run --project evals
      - name: Commit repaired host coverage
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard evals/agent-instructions/cases)" ]; then
            echo 'No repair changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evals/agent-instructions docs/agent-guidance/eval-suite.md
          git commit -m 'test(evals): cover all supported product hosts'
          git push origin HEAD:feat/mandates-v5
