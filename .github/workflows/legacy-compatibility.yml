name: Legacy Compatibility Guard

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-compatibility:
    name: legacy-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: feat/mandates-v5
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply repository formatter
        run: |
          npx prettier --write \
            evals/agent-instructions/schema.ts \
            evals/agent-instructions/run.ts \
            evals/agent-instructions/runners/process-runner.ts \
            evals/agent-instructions/__tests__/schema.test.ts \
            evals/agent-instructions/__tests__/process-runner.test.ts \
            evals/agent-instructions/README.md \
            docs/agent-guidance/eval-suite.md \
            evals/agent-instructions/cases/product-*.yaml \
            .github/workflows/agent-instruction-evals.yml
      - name: Verify formatted tree
        run: |
          npm run check:format
          npx vitest run --project evals
          npm run check
      - name: Commit formatter output and restore guard
        run: |
          git checkout origin/develop -- .github/workflows/legacy-compatibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/legacy-compatibility.yml .github/workflows/agent-instruction-evals.yml evals/agent-instructions docs/agent-guidance/eval-suite.md
          if git diff --cached --quiet; then
            echo 'No formatter changes'
            exit 0
          fi
          git commit -m 'style(evals): apply canonical formatting'
          git push origin HEAD:feat/mandates-v5
