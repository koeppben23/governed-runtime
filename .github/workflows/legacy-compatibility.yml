name: Legacy Compatibility Guard

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-compatibility:
    name: legacy-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Print canonical Prettier diff for failing files
        run: |
          npx prettier --write \
            src/cli/install-helpers-core.test.ts \
            src/cli/install-templates.test.ts \
            src/integration/review/prompt-builders.ts \
            src/rendering/mandates-renderer.ts \
            src/templates/mandates-phase-aware.test.ts \
            src/templates/mandates.ts
          git diff -- \
            src/cli/install-helpers-core.test.ts \
            src/cli/install-templates.test.ts \
            src/integration/review/prompt-builders.ts \
            src/rendering/mandates-renderer.ts \
            src/templates/mandates-phase-aware.test.ts \
            src/templates/mandates.ts
          exit 1
