name: Legacy Compatibility Guard

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-compatibility:
    name: legacy-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: feat/mandates-v5
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Close dead Doctor status contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected pattern missing in {path}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'src/cli/install.ts',
              "    instruction_missing: 'INSTR_MISSING',\n    instruction_stale: 'INSTR_STALE',\n    error: 'ERROR',",
              "    instruction_missing: 'INSTR_MISSING',\n    error: 'ERROR',",
          )
          replace(
              'src/cli/install-cli.test.ts',
              "        { file: 'f', status: 'instruction_missing' },\n        { file: 'g', status: 'instruction_stale' },\n        { file: 'h', status: 'error', detail: 'malformed' },",
              "        { file: 'f', status: 'instruction_missing' },\n        { file: 'g', status: 'error', detail: 'malformed' },",
          )
          replace(
              'src/cli/install-cli.test.ts',
              "      expect(output).toContain('[INSTR_MISSING]');\n      expect(output).toContain('[INSTR_STALE]');\n      expect(output).toContain('[ERROR]');",
              "      expect(output).toContain('[INSTR_MISSING]');\n      expect(output).toContain('[ERROR]');",
          )
          PY
      - name: Canonical formatting
        run: npx prettier --write src/cli/install-types.ts src/cli/install.ts src/cli/install-cli.test.ts evals/agent-instructions/run.ts evals/agent-instructions/schema.ts evals/agent-instructions/runners/process-runner.ts evals/agent-instructions/__tests__/schema.test.ts evals/agent-instructions/__tests__/process-runner.test.ts evals/agent-instructions/README.md docs/agent-guidance/eval-suite.md evals/agent-instructions/cases/product-*.yaml
      - name: Verify forensic repairs
        run: |
          npm run check:format
          npx vitest run --project unit src/cli/install-cli.test.ts src/cli/install-install.test.ts src/cli/install-mandate-ownership.test.ts src/cli/templates-hash.test.ts
          npx vitest run --project integration src/integration/review/prompt-builders.test.ts
          npx vitest run --project evals
          npm run check
      - name: Commit canonical repairs and restore workflow
        run: |
          git checkout origin/develop -- .github/workflows/legacy-compatibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/legacy-compatibility.yml src/cli/install-types.ts src/cli/install.ts src/cli/install-cli.test.ts evals/agent-instructions docs/agent-guidance/eval-suite.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(mandates): close forensic contract gaps'
          git push origin HEAD:feat/mandates-v5
