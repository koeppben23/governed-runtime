name: Temporary forensic fixes 879 v2

on:
  push:
    branches:
      - feat/mandates-v5

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mandates-v5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Disambiguate patch targets
        run: |
          python scripts/tmp-forensic-fix-879-correct.py
          python scripts/tmp-forensic-fix-879-correct2.py
          python scripts/tmp-forensic-fix-879-correct3.py
      - name: Apply forensic fixes
        run: python scripts/tmp-forensic-fix-879.py
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        id: format
        shell: bash
        run: |
          set -o pipefail
          npx prettier --write src/integration/review/assurance.ts src/integration/review/standard-review-pipeline.ts src/integration/review/pipeline-types.ts src/integration/review/shared-helpers.ts src/integration/review/orchestrator.ts src/integration/review/content-review-pipeline.ts src/integration/review/pending-instruction.ts src/integration/review/host-task-policy.ts src/integration/plugin-orchestrator-independent-review.test.ts src/integration/plugin-orchestrator-review-content.test.ts src/cli/install-ownership.ts src/cli/install-command.ts src/cli/uninstall-command.ts src/cli/install-uninstall.test.ts src/cli/install-ownership-regression.test.ts src/cli/install-types.ts src/cli/claude-code-plugin-install.ts src/cli/platform-uninstall.ts 2>&1 | tee forensic-format-error.txt
      - name: Persist format diagnostic on failure
        if: steps.format.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensic-format-error.txt
          git commit -m "chore: capture forensic format diagnostic" || true
          git push origin HEAD:feat/mandates-v5
      - name: Targeted forensic tests
        id: tests
        if: steps.format.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/integration/plugin-orchestrator-independent-review.test.ts src/integration/plugin-orchestrator-review-content.test.ts src/integration/review/orchestrator.test.ts src/integration/review/prompt-builders.test.ts src/integration/review/host-task-policy.test.ts src/cli/install-ownership-regression.test.ts src/cli/install-uninstall.test.ts 2>&1 | tee forensic-test-error.txt
      - name: Persist test diagnostic on failure
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensic-test-error.txt
          git commit -m "chore: capture forensic test diagnostic" || true
          git push origin HEAD:feat/mandates-v5
      - name: Typecheck
        id: typecheck
        if: steps.tests.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee forensic-typecheck-error.txt
      - name: Persist typecheck diagnostic on failure
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensic-typecheck-error.txt
          git commit -m "chore: capture forensic typecheck diagnostic" || true
          git push origin HEAD:feat/mandates-v5
      - name: Lint
        id: lint
        if: steps.tests.outcome == 'success' && steps.typecheck.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee forensic-lint-error.txt
      - name: Persist lint diagnostic on failure
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensic-lint-error.txt
          git commit -m "chore: capture forensic lint diagnostic" || true
          git push origin HEAD:feat/mandates-v5
      - name: Remove temporary runner and commit fixes
        if: steps.tests.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.lint.outcome == 'success'
        shell: bash
        run: |
          git rm .github/workflows/tmp-forensic-fixes-879-v2.yml scripts/tmp-forensic-fix-879.py scripts/tmp-forensic-fix-879-correct.py scripts/tmp-forensic-fix-879-correct2.py scripts/tmp-forensic-fix-879-correct3.py
          rm -f forensic-patch-error.txt forensic-format-error.txt forensic-test-error.txt forensic-typecheck-error.txt forensic-lint-error.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close forensic assurance and ownership gaps"
          git push origin HEAD:feat/mandates-v5
