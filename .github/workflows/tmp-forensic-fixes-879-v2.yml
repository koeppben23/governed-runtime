name: Temporary forensic fixes 879 v2

on:
  push:
    branches:
      - feat/mandates-v5

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mandates-v5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Disambiguate patch targets
        run: python scripts/tmp-forensic-fix-879-correct.py
      - name: Apply forensic fixes
        shell: bash
        run: python scripts/tmp-forensic-fix-879.py 2>&1 | tee forensic-patch-error.txt
      - name: Persist patch diagnostic on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensic-patch-error.txt
          git commit -m "chore: capture forensic patch diagnostic" || true
          git push origin HEAD:feat/mandates-v5
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npx prettier --write src/integration/review/assurance.ts src/integration/review/standard-review-pipeline.ts src/integration/review/pipeline-types.ts src/integration/review/shared-helpers.ts src/integration/review/orchestrator.ts src/integration/review/content-review-pipeline.ts src/integration/review/pending-instruction.ts src/integration/review/host-task-policy.ts src/cli/install-ownership.ts src/cli/install-command.ts src/cli/uninstall-command.ts src/cli/install-uninstall.test.ts src/cli/install-ownership-regression.test.ts src/integration/plugin-orchestrator-independent-review.test.ts
      - name: Targeted forensic tests
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/integration/plugin-orchestrator-independent-review.test.ts src/integration/plugin-orchestrator-review-content.test.ts src/integration/review/orchestrator.test.ts src/integration/review/prompt-builders.test.ts src/integration/review/host-task-policy.test.ts src/cli/install-ownership-regression.test.ts src/cli/install-uninstall.test.ts 2>&1 | tee forensic-test-error.txt
      - name: Persist test diagnostic on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensic-test-error.txt
          git commit -m "chore: capture forensic test diagnostic" || true
          git push origin HEAD:feat/mandates-v5
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Remove temporary runner and commit fixes
        shell: bash
        run: |
          git rm .github/workflows/tmp-forensic-fixes-879-v2.yml scripts/tmp-forensic-fix-879.py scripts/tmp-forensic-fix-879-correct.py
          rm -f forensic-patch-error.txt forensic-test-error.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close forensic assurance and ownership gaps"
          git push origin HEAD:feat/mandates-v5
