name: Temporary forensic fixes 879

on:
  push:
    branches:
      - feat/mandates-v5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mandates-v5
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply forensic fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def r(path): return Path(path).read_text()
          def w(path, text): Path(path).write_text(text)
          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          p = 'src/integration/review/assurance.ts'
          t = r(p)
          t = one(t, "export const REVIEW_CRITERIA_VERSION = 'p41-v1';", "export const REVIEW_CRITERIA_VERSION = 'p42-v1';", p)
          w(p, t)
          p = 'src/integration/review/assurance.test.ts'
          t = r(p)
          t = t.replace('creates p41 obligations without rewriting prior attestation values', 'creates p42 obligations without rewriting prior attestation values')
          t = t.replace("expect(REVIEW_CRITERIA_VERSION).toBe('p41-v1');", "expect(REVIEW_CRITERIA_VERSION).toBe('p42-v1');")
          t = t.replace("expect(fresh.criteriaVersion).toBe('p41-v1');", "expect(fresh.criteriaVersion).toBe('p42-v1');")
          w(p, t)

          p = 'src/presentation/next-action-copy.ts'
          t = r(p)
          start = t.index('  RUN_REVIEWER_TASK: {')
          end = t.index('  SUBMIT_REVIEWER_VERDICT:', start)
          t = t[:start] + t[end:]
          needle = '  const code = action.code as ActionCode;\n  const guidance = PRODUCT_GUIDANCE[code];'
          replacement = """  if (action.code === ACTION_CODES.RUN_REVIEWER_TASK) {
            return {
              text: action.text,
              commands: action.commands,
              presentationForm: 'review_pending',
            };
          }

          const code = action.code as ActionCode;
          const guidance = PRODUCT_GUIDANCE[code];"""
          t = one(t, needle, replacement, p)
          w(p, t)

          p = 'src/presentation/next-action-copy.test.ts'
          t = r(p)
          marker = "  describe('CORNER — unknown codes fall back to canonical', () => {"
          block = """  describe('RUN_REVIEWER_TASK — preserve canonical phase routing', () => {
            it.each([
              ['PLAN', 'Independent plan review is pending. Submit the reviewer verdict with /plan.'],
              ['ARCHITECTURE', 'Independent architecture review is pending. Submit the reviewer verdict with /architecture.'],
              ['IMPL_REVIEW', 'Independent implementation review is pending. Submit the reviewer verdict with flowguard_review_implementation.'],
              ['REVIEW', 'Independent content review is pending. Submit the reviewer verdict with flowguard_review.'],
            ] as const)('preserves %s routing instead of substituting content-review copy', (phase, canonicalText) => {
              const action = { code: 'RUN_REVIEWER_TASK', text: canonicalText, commands: [] as string[] };
              expect(buildProductNextAction(action, phase)).toEqual({
                text: canonicalText,
                commands: [],
                presentationForm: 'review_pending',
              });
            });
          });

          """
          t = one(t, marker, block + marker, p)
          w(p, t)

          p = 'src/integration/review/impl-review-prompt.ts'
          t = r(p)
          needle = 'export interface ReviewVerificationEvidenceItem {\n'
          block = """export interface ReviewClaimAssertionEvidence {
            readonly checkId: string;
            readonly providerId: string;
            readonly localId: string;
            readonly status: 'passed' | 'failed' | 'errored' | 'skipped';
            readonly suiteName?: string;
            readonly testName: string;
            readonly sourceFile?: string;
            readonly durationMs?: number;
          }

          export interface ReviewClaimAssertionEvidenceSet {
            readonly reportDigests: readonly string[];
            readonly assertions: readonly ReviewClaimAssertionEvidence[];
          }

          """
          t = one(t, needle, block + needle, p)
          t = one(t, '  readonly executedAt: string;\n}', '  readonly executedAt: string;\n  readonly claimAssertionEvidence?: ReviewClaimAssertionEvidenceSet;\n}', p)
          old = """  const rows = evidence.map((item) => {
            const status = item.timedOut ? 'TIMED_OUT' : item.passed ? 'PASS' : 'FAIL';
            return (
              `- [${status}] kind=${item.kind} exitCode=${item.exitCode} durationMs=${item.executionMs} ` +
              `digest=${item.outputDigest}\\n` +
              `  command: ${item.command}\\n` +
              `  detail: ${item.detail}`
            );
          });"""
          new = """  const rows = evidence.map((item) => {
            const status = item.timedOut ? 'TIMED_OUT' : item.passed ? 'PASS' : 'FAIL';
            const base =
              `- [${status}] kind=${item.kind} exitCode=${item.exitCode} durationMs=${item.executionMs} ` +
              `digest=${item.outputDigest}\\n` +
              `  command: ${item.command}\\n` +
              `  detail: ${item.detail}`;
            if (!item.claimAssertionEvidence) return base;
            const assertionLines = item.claimAssertionEvidence.assertions.map(
              (assertion) =>
                `    - checkId=${assertion.checkId} providerId=${assertion.providerId} ` +
                `localId=${assertion.localId} status=${assertion.status}`,
            );
            return [
              base,
              `  claim-relevant structured assertions (host-extracted; reportDigests=${item.claimAssertionEvidence.reportDigests.join(',')}):`,
              ...assertionLines,
            ].join('\\n');
          });"""
          t = one(t, old, new, p)
          w(p, t)

          p = 'src/integration/review/shared-helpers.ts'
          t = r(p)
          start = t.index('export function stateVerificationEvidence(')
          end = t.index('// ─── State + Audit Persistence Helper', start)
          replacement = """function assertionRequirementKey(checkId: string, providerId: string, localId: string): string {
            return `${checkId}\\u0000${providerId}\\u0000${localId}`;
          }

          function declaredAssertionRequirementKeys(state: SessionState): ReadonlySet<string> {
            const keys = new Set<string>();
            for (const claim of state.plan?.claimDeclarations?.claims ?? []) {
              const requirement = claim.counterexampleRequirement;
              if (requirement?.kind !== 'assertion') continue;
              keys.add(
                assertionRequirementKey(
                  requirement.checkId,
                  requirement.assertion.providerId,
                  requirement.assertion.localId,
                ),
              );
            }
            return keys;
          }

          function projectClaimAssertionEvidence(
            attempt: Extract<SessionState['validationAttempts'][number], { scope: 'implementation' }>,
            requirementKeys: ReadonlySet<string>,
          ): ReviewVerificationEvidenceItem['claimAssertionEvidence'] {
            const extraction = attempt.result.assertionExtraction;
            if (extraction?.status !== 'extracted' || requirementKeys.size === 0) return undefined;
            const assertions = extraction.assertions
              .filter((assertion) =>
                requirementKeys.has(
                  assertionRequirementKey(
                    attempt.result.checkId,
                    assertion.providerId,
                    assertion.assertion.localId,
                  ),
                ),
              )
              .map((assertion) => ({
                checkId: attempt.result.checkId,
                providerId: assertion.providerId,
                localId: assertion.assertion.localId,
                status: assertion.status,
                ...(assertion.suiteName ? { suiteName: assertion.suiteName } : {}),
                testName: assertion.testName,
                ...(assertion.sourceFile ? { sourceFile: assertion.sourceFile } : {}),
                ...(assertion.durationMs !== undefined ? { durationMs: assertion.durationMs } : {}),
              }));
            if (assertions.length === 0) return undefined;
            return { reportDigests: [...extraction.reportDigests], assertions };
          }

          export function stateVerificationEvidence(
            state: SessionState,
          ): readonly ReviewVerificationEvidenceItem[] {
            const currentDigest = state.implementation?.digest;
            if (!currentDigest) return [];
            const requirementKeys = declaredAssertionRequirementKeys(state);
            return state.validationAttempts
              .filter(
                (attempt): attempt is Extract<
                  SessionState['validationAttempts'][number],
                  { scope: 'implementation' }
                > => attempt.scope === 'implementation' && attempt.implementationDigest === currentDigest,
              )
              .map((attempt) => {
                const claimAssertionEvidence = projectClaimAssertionEvidence(attempt, requirementKeys);
                return {
                  attemptId: attempt.attemptId,
                  kind: attempt.result.kind,
                  command: attempt.result.command,
                  passed: attempt.result.passed,
                  exitCode: attempt.result.exitCode,
                  timedOut: attempt.result.timedOut,
                  executionMs: attempt.result.executionMs,
                  outputDigest: attempt.result.outputDigest,
                  detail: attempt.result.detail,
                  executedAt: attempt.result.executedAt,
                  ...(claimAssertionEvidence ? { claimAssertionEvidence } : {}),
                };
              });
          }

          """
          t = t[:start] + replacement + t[end:]
          w(p, t)

          p = 'src/integration/review/verification-evidence-projection.test.ts'
          t = r(p)
          t = one(t, "import { IMPL_EVIDENCE, VALIDATION_PASSED, makeState } from '../../fixtures.js';", "import { IMPL_EVIDENCE, PLAN_RECORD, VALIDATION_PASSED, makeState } from '../../fixtures.js';", p)
          block = """
            it('projects only claim-relevant structured assertion evidence from the current implementation', () => {
              const matchingLocalId = 'com.example.TaskControllerTest#missingTask';
              const validation = {
                ...VALIDATION_PASSED[0]!,
                assertionExtraction: {
                  status: 'extracted' as const,
                  attemptId: '22222222-2222-4222-8222-222222222222',
                  providerId: 'junit' as const,
                  format: 'junit_xml',
                  bindingCapability: 'assertion' as const,
                  reportDigests: ['c'.repeat(64)],
                  assertions: [
                    { assertion: { providerId: 'junit' as const, localId: matchingLocalId }, providerId: 'junit' as const, status: 'passed' as const, suiteName: 'com.example.TaskControllerTest', testName: 'missingTask' },
                    { assertion: { providerId: 'junit' as const, localId: 'com.example.TaskControllerTest#unrelated' }, providerId: 'junit' as const, status: 'passed' as const, suiteName: 'com.example.TaskControllerTest', testName: 'unrelated' },
                  ],
                  summary: { assertionCount: 2, passedCount: 2, failedCount: 0, erroredCount: 0, skippedCount: 0, suiteInfrastructureError: false },
                },
              };
              const state = makeState('IMPL_REVIEW', {
                implementation: IMPL_EVIDENCE,
                plan: {
                  ...PLAN_RECORD,
                  claimDeclarations: {
                    flow: 'plan' as const,
                    version: 'v2' as const,
                    claims: [{ claimId: '11111111-1111-4111-8111-111111111111', statement: 'missing task returns 404', critical: true, authoritySectionId: 'implementation', claimScope: 'specific_behavior' as const, expectedCheckId: 'test', counterexampleRequirement: { kind: 'assertion' as const, checkId: 'test', assertion: { providerId: 'junit' as const, localId: matchingLocalId } } }],
                  },
                },
                validationAttempts: [implAttempt({ result: validation })] as never,
              });
              expect(stateVerificationEvidence(state)[0]?.claimAssertionEvidence).toEqual({
                reportDigests: ['c'.repeat(64)],
                assertions: [{ checkId: 'test', providerId: 'junit', localId: matchingLocalId, status: 'passed', suiteName: 'com.example.TaskControllerTest', testName: 'missingTask' }],
              });
            });
          """
          idx = t.rfind('});')
          w(p, t[:idx] + block + t[idx:])

          p = 'src/integration/review/verification-evidence-prompt.test.ts'
          t = r(p)
          marker = "  it('renders a failing check as FAIL (not hidden)', () => {"
          block = """  it('renders claim-relevant structured assertion identity and report binding', () => {
            const text = renderVerificationEvidence([{
              ...PASS_ITEM,
              claimAssertionEvidence: {
                reportDigests: ['c'.repeat(64)],
                assertions: [{ checkId: 'test', providerId: 'junit', localId: 'com.example.TaskControllerTest#missingTask', status: 'passed', testName: 'missingTask' }],
              },
            }]).join('\\n');
            expect(text).toContain('claim-relevant structured assertions (host-extracted');
            expect(text).toContain(`reportDigests=${'c'.repeat(64)}`);
            expect(text).toContain('checkId=test providerId=junit localId=com.example.TaskControllerTest#missingTask status=passed');
          });

          """
          t = one(t, marker, block + marker, p)
          w(p, t)

          p = 'src/integration/plugin-task-evidence.ts'
          t = r(p)
          t = one(t, '          modelPromptDigest: execution.modelPromptDigest,\n', '          modelPromptDigest: execution.modelPromptDigest,\n          createdAt: execution.createdAt,\n', p)
          w(p, t)

          p = 'src/integration/review/evidence-binding.ts'
          t = r(p)
          t = one(t, "import type { SessionEnforcementState, HostTaskBindResult } from './enforcement/types.js';", "import type {\n  SessionEnforcementState,\n  HostTaskBindResult,\n  ExecutedTaskPrompt,\n} from './enforcement/types.js';", p)
          marker = '/** Transport contract for captured findings: recovered findings downgrade assurance. */'
          alias = """type HostTaskPromptProvenance = Pick<
            ExecutedTaskPrompt,
            'callId' | 'canonicalPromptDigest' | 'modelPromptDigest' | 'createdAt'
          >;

          """
          t = one(t, marker, alias + marker, p)
          first = t.index('    readonly promptProvenance?: {')
          first_end = t.index('    };', first) + len('    };')
          t = t[:first] + '    readonly promptProvenance?: HostTaskPromptProvenance;' + t[first_end:]
          second = t.index('  promptProvenance?: {')
          second_end = t.index('  };', second) + len('  };')
          t = t[:second] + '  promptProvenance?: HostTaskPromptProvenance;' + t[second_end:]
          t = one(t, "    invokedAt: now,\n    source: 'host-orchestrated',", "    invokedAt: input.promptProvenance?.createdAt ?? input.attempt.createdAt,\n    fulfilledAt: latest.subagentRecord?.completedAt ?? now,\n    source: 'host-orchestrated',", p)
          w(p, t)

          p = 'src/integration/review/evidence-binding-provenance.test.ts'
          t = r(p)
          block = """
            it('binds invocation lifecycle to host dispatch start and Task completion', () => {
              const { state, obligation, attempts } = setupHostStampedCycle();
              const result = buildHostTaskEvidence(state, SESSION_ID, LATER, {
                obligations: [obligation],
                invocations: [],
                attempts,
                promptProvenance: {
                  callId: 'call_provenance_001',
                  canonicalPromptDigest: 'a'.repeat(64),
                  modelPromptDigest: null,
                  createdAt: NOW,
                },
              });
              expect(result.evidence?.invokedAt).toBe(NOW);
              expect(result.evidence?.fulfilledAt).toBe(LATER);
            });
          """
          idx = t.rfind('});')
          w(p, t[:idx] + block + t[idx:])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npx prettier --write src/integration/review/assurance.ts src/integration/review/assurance.test.ts src/presentation/next-action-copy.ts src/presentation/next-action-copy.test.ts src/integration/review/impl-review-prompt.ts src/integration/review/shared-helpers.ts src/integration/review/verification-evidence-projection.test.ts src/integration/review/verification-evidence-prompt.test.ts src/integration/plugin-task-evidence.ts src/integration/review/evidence-binding.ts src/integration/review/evidence-binding-provenance.test.ts
      - name: Targeted verification
        run: |
          npx vitest run --project unit src/presentation/next-action-copy.test.ts
          npx vitest run --project integration src/integration/review/assurance.test.ts src/integration/review/verification-evidence-projection.test.ts src/integration/review/verification-evidence-prompt.test.ts src/integration/review/evidence-binding-provenance.test.ts
          npm run typecheck
          npm run lint:strict
          npm run check:format
      - name: Commit directly to PR branch and remove temporary CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-forensic-fixes-879.yml
          git add src/integration/review/assurance.ts src/integration/review/assurance.test.ts src/presentation/next-action-copy.ts src/presentation/next-action-copy.test.ts src/integration/review/impl-review-prompt.ts src/integration/review/shared-helpers.ts src/integration/review/verification-evidence-projection.test.ts src/integration/review/verification-evidence-prompt.test.ts src/integration/plugin-task-evidence.ts src/integration/review/evidence-binding.ts src/integration/review/evidence-binding-provenance.test.ts
          git commit -m "fix: close forensic review gaps"
          git push origin HEAD:feat/mandates-v5
