name: Temporary forensic fixes 879

on:
  push:
    branches: [feat/mandates-v5]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mandates-v5
          fetch-depth: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Recover and execute corrected patch
        run: |
          git show 4844d8f4a2e723a4ace78b5ab02c333385c036b7:.github/workflows/tmp-forensic-fixes-879.yml > /tmp/original-workflow.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/original-workflow.yml').read_text()
          start = text.index("          from pathlib import Path\n")
          end = text.index("          PY\n", start)
          block = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              "render+'function renderImplementationAnchorContract('",
              'render',
          )
          script = script.replace(
              "projection+'// ─── State + Audit Persistence Helper'",
              'projection',
          )
          Path('/tmp/patch.py').write_text(script)
          PY
          python /tmp/patch.py
      - run: npm ci
      - name: Format and verify
        run: |
          npx prettier --write src/integration/review/assurance.ts src/integration/review/assurance.test.ts src/presentation/next-action-copy.ts src/presentation/next-action-copy.test.ts src/integration/review/impl-review-prompt.ts src/integration/review/shared-helpers.ts src/integration/review/verification-evidence-prompt.test.ts src/integration/plugin-task-evidence.ts src/integration/review/evidence-binding.ts src/integration/review/evidence-binding-provenance.test.ts
          npx vitest run --project unit src/presentation/next-action-copy.test.ts
          npx vitest run --project integration src/integration/review/assurance.test.ts src/integration/review/verification-evidence-prompt.test.ts src/integration/review/evidence-binding-provenance.test.ts
          npm run typecheck
          npm run lint:strict
          npm run check:format
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-forensic-fixes-879.yml
          git add src/integration/review/assurance.ts src/integration/review/assurance.test.ts src/presentation/next-action-copy.ts src/presentation/next-action-copy.test.ts src/integration/review/impl-review-prompt.ts src/integration/review/shared-helpers.ts src/integration/review/verification-evidence-prompt.test.ts src/integration/plugin-task-evidence.ts src/integration/review/evidence-binding.ts src/integration/review/evidence-binding-provenance.test.ts
          git commit -m "fix: close forensic review gaps"
          git push origin HEAD:feat/mandates-v5
