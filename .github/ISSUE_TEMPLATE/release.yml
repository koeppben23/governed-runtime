name: Release
description: Prepare a FlowGuard release through protected main
title: 'chore(release): cut v'
labels: ['release']
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.2.0-rc.4
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Protected Main Release Checklist
      value: |
        - [ ] Follow the canonical protected-main release procedure in CONTRIBUTING.md.
        - [ ] Record any recovery from a pre-merge tag according to CONTRIBUTING.md.
    validations:
      required: true
