name: Prepare Node
description: Install the pinned Node toolchain from .node-version and the locked dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Use runner temporary directory on Windows
      if: runner.os == 'Windows'
      shell: bash
      env:
        TEST_TEMP: ${{ runner.temp }}
      run: |
        : "${TEST_TEMP:?Runner temporary directory is required}"
        printf 'TEMP=%s\nTMP=%s\n' "$TEST_TEMP" "$TEST_TEMP" >> "$GITHUB_ENV"
    - name: Install dependencies
      shell: bash
      run: npm ci
